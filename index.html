<!DOCTYPE html>
<html>
<head>
  <title>Attendance Tracker</title>
</head>
<body>
  <h1>Attendance Tracker</h1>

  <input id="studentName" placeholder="Student name">
  <button onclick="addStudent()">Add Student</button>

  <br><br>

  <input id="sessionTitle" placeholder="Session title">
  <button onclick="createSession()">Create Session</button>

  <h2>Sessions</h2>
  <select id="sessionSelect" onchange="loadStudents()">
    <option value="">Select a session</option>
  </select>

  <h2>Students</h2>
  <ul id="students"></ul>

  <script>
    const API_BASE = "https://attendance-tracker-dp4l.onrender.com";

    async function addStudent() {
      const name = document.getElementById("studentName").value;
      if (!name) return alert("Enter a name");

      await fetch(`${API_BASE}/users/?name=${encodeURIComponent(name)}`, {
        method: "POST"
      });

      document.getElementById("studentName").value = "";
      loadStudents();
    }

    async function createSession() {
      const title = document.getElementById("sessionTitle").value;
      if (!title) return alert("Enter a session title");

      const res = await fetch(`${API_BASE}/tasks/?title=${encodeURIComponent(title)}`, {
        method: "POST"
      });
      document.getElementById("sessionTitle").value = "";
      loadSessions();
    }

    async function loadSessions() {
      const res = await fetch(`${API_BASE}/tasks/`);
      const sessions = await res.json();
      const select = document.getElementById("sessionSelect");
      select.innerHTML = `<option value="">Select a session</option>`;
      sessions.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.title;
        select.appendChild(opt);
      });
      loadStudents();
    }

    async function loadStudents() {
      const sessionId = document.getElementById("sessionSelect").value;
      if (!sessionId) {
        document.getElementById("students").innerHTML = "<li>Select a session first</li>";
        return;
      }

      const res = await fetch(`${API_BASE}/tasks/attendance/${sessionId}`);
      const students = await res.json();

      const list = document.getElementById("students");
      list.innerHTML = "";

      students.forEach(s => {
        const li = document.createElement("li");
        li.innerHTML = `
          <strong>${s.name}</strong>
          (Present: ${s.present_count || 0}, Late: ${s.late_count || 0}, Status: ${s.status})
          <br>
          <button onclick="markAttendance(${s.id}, ${sessionId}, 'present')">Present</button>
          <button onclick="markAttendance(${s.id}, ${sessionId}, 'late')">Late</button>
          <button onclick="markAttendance(${s.id}, ${sessionId}, 'absent')">Absent</button>
          <button onclick="deleteStudent(${s.id})">Delete</button>
        `;
        list.appendChild(li);
      });
    }

    async function markAttendance(userId, taskId, status) {
      await fetch(`${API_BASE}/tasks/attendance?user_id=${userId}&task_id=${taskId}&status=${status}`, {
        method: "POST"
      });
      loadStudents();
    }

    async function deleteStudent(userId) {
      await fetch(`${API_BASE}/users/${userId}`, { method: "DELETE" });
      loadStudents();
    }

    loadSessions();
  </script>
</body>
</html>
